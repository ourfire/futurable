<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futurable · El futuro del trabajo</title>
<meta name="description" content="El futuro del trabajo es la vertical principal de Futurable. Prueba ARCA: una entrevista de embarque de 5 minutos para saber qué tan preparado estás para el gran salto.">
<meta property="og:title" content="Futurable · El futuro del trabajo">
<meta property="og:description" content="Prueba ARCA: una entrevista de embarque de 5 minutos para saber qué tan preparado estás para el gran salto.">
<meta property="og:image" content="https://futurable.work/arca/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/assets/logo/futurable-box-dark.png" type="image/png">
<link rel="preload" href="/assets/fonts/zalando-sans-expanded-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/zalando-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/futurable.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--f-bg);color:var(--f-text);font-family:var(--f-body);font-size:20px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
a{color:inherit}
.gutter{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;width:100%}

header{padding-top:env(safe-area-inset-top,0px)}
.nav{display:flex;align-items:center;height:84px}
.logo img{display:block;width:auto;height:30px}

main{flex:1;display:flex;align-items:center;padding-block:clamp(32px,6vw,80px)}
main .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(32px,6vw,88px);align-items:center}
@media (max-width:900px){main .wrap{grid-template-columns:1fr}}
.eyebrow{font-family:var(--f-display);font-size:13px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--f-muted);display:flex;align-items:center;gap:14px;margin-bottom:22px}
.eyebrow::before{content:"";width:40px;height:1px;background:var(--f-ink)}
h1{font-family:var(--f-display);font-weight:400;color:var(--f-ink);font-size:clamp(46px,7vw,104px);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
h1 span{color:var(--f-muted)}

/* ARCA: el artefacto presentado como una pieza que se puede abrir */
.arca{display:block;text-decoration:none;color:inherit;border-radius:14px;overflow:hidden;border:1px solid var(--f-line);background:#F3EBDA;box-shadow:0 30px 60px -30px rgba(15,15,15,.35);transition:transform .25s, box-shadow .25s}
.arca:hover{transform:translateY(-4px);box-shadow:0 40px 70px -30px rgba(15,15,15,.45)}
.arca:focus-visible{outline:2px solid var(--f-ink);outline-offset:4px}
.arca img{display:block;width:100%;height:auto;aspect-ratio:1200/630}
.arca .meta{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;background:#fff;border-top:1px solid var(--f-line);flex-wrap:wrap}
.arca .meta p{font-size:16px;line-height:1.45;color:var(--f-muted);max-width:28em}
.arca .meta p b{display:block;font-family:var(--f-display);font-weight:500;font-size:17px;color:var(--f-ink);margin-bottom:2px}
.cta{display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:16px 26px;border-radius:var(--f-radius);border:1px solid var(--f-ink);background:var(--f-ink);color:#fff;font-family:var(--f-display);font-size:15px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.arca:hover .cta{background:#fff;color:var(--f-ink)}

footer{padding-block:28px calc(28px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;justify-content:center}
footer a{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:15px;font-weight:500;color:var(--f-ink);text-decoration:none;border-bottom:1px solid var(--f-ink);padding-bottom:4px}
footer .made{font-family:var(--f-display);font-size:15px;font-weight:500;color:var(--f-muted);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;justify-content:center}
footer a:hover{color:var(--f-muted);border-color:var(--f-muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="gutter">
  <div class="wrap nav"><a class="logo" href="/" aria-label="Futurable"><img src="/assets/logo/futurable-lockup-ink.png" alt="Futurable"></a></div>
</header>

<main class="gutter">
  <div class="wrap">
    <div>
      <h1>El futuro del <span>trabajo.</span></h1>
    </div>
    <a class="arca" href="/arca/" aria-label="Abrir ARCA, la entrevista de embarque">
      <img src="/arca/og.png" alt="ARCA, Agencia de Reubicación de Capacidades Humanas. Antes del diluvio, aborda.">
      <div class="meta">
        <p><b>ARCA · Entrevista de embarque</b>18 preguntas, 5 minutos. Descubre qué tan preparado estás para el gran salto.</p>
        <span class="cta">Abordar <span aria-hidden="true">→</span></span>
      </div>
    </a>
  </div>
</main>

<footer class="gutter">
  <div class="wrap"><p class="made">Hecho con urgencia por <a href="https://futurable.now">futurable.now <span aria-hidden="true">↗</span></a></p></div>
</footer>
</body>
</html>
