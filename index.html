<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futurable · El futuro del trabajo</title>
<meta name="description" content="El futuro del trabajo es la vertical principal de Futurable. Prueba ARCA: una entrevista de embarque de 5 minutos para saber qué tan preparado estás para el gran salto.">
<meta property="og:title" content="Futurable · El futuro del trabajo">
<meta property="og:description" content="Prueba ARCA: una entrevista de embarque de 5 minutos para saber qué tan preparado estás para el gran salto.">
<meta property="og:image" content="https://futurable.work/arca/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFFFFF" id="themeColor">
<link rel="icon" href="/assets/logo/futurable-work-w-dark.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/zalando-sans-expanded-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/zalando-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/futurable.css">
<script>
// Tema e idioma antes de pintar, para que no parpadee.
(function(){
  var d=document.documentElement, q=new URLSearchParams(location.search), t=null, l=null;
  try{ t=localStorage.getItem('fw-theme'); l=localStorage.getItem('fw-lang'); }catch(e){}
  if(q.get('lang')==='en'||q.get('lang')==='es') l=q.get('lang');
  if(!t) t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  if(!l) l=/^es\b/i.test(navigator.language||'es')?'es':'en';
  d.setAttribute('data-theme',t); d.lang=l;
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--f-surface:#FFFFFF;--f-card-bg:#F3EBDA;--f-shadow:rgba(15,15,15,.35)}
:root[data-theme="dark"]{
  --f-bg:#0E0E0E; --f-ink:#F4F4F2; --f-text:#E8E8E6; --f-muted:#A3A3A0; --f-line:#2A2A2A;
  --f-surface:#161616; --f-card-bg:#1E1C18; --f-shadow:rgba(0,0,0,.7);
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--f-bg);color:var(--f-text);font-family:var(--f-body);font-size:20px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;transition:background .25s,color .25s}
a{color:inherit}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:600px){.gutter{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}}
.wrap{max-width:1180px;margin:0 auto;width:100%}

/* Controles: idioma y tema */
.bar{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.bar .wrap{display:flex;justify-content:flex-end;gap:10px}
.seg{display:inline-flex;border:1px solid var(--f-line);border-radius:999px;padding:3px;background:var(--f-surface)}
.seg button,.icon-btn{font:500 13px/1 var(--f-display);letter-spacing:.08em;color:var(--f-muted);background:none;border:0;cursor:pointer;min-width:44px;min-height:36px;padding:0 12px;border-radius:999px;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--f-ink);color:var(--f-bg)}
.seg button:hover:not([aria-pressed="true"]),.icon-btn:hover{color:var(--f-ink)}
.icon-btn{display:inline-grid;place-items:center;border:1px solid var(--f-line);background:var(--f-surface);min-width:44px;min-height:44px;padding:0}
.icon-btn svg{width:18px;height:18px}
.icon-btn .sun{display:none}
:root[data-theme="dark"] .icon-btn .sun{display:block}
:root[data-theme="dark"] .icon-btn .moon{display:none}
button:focus-visible{outline:2px solid var(--f-ink);outline-offset:2px}

main{flex:1;display:flex;align-items:center;padding-block:clamp(28px,7vw,88px) clamp(28px,6vw,72px)}
main .wrap{display:flex;flex-direction:column;align-items:center;gap:clamp(28px,5vw,56px);max-width:860px}
.title{display:flex;flex-direction:column;align-items:center;gap:clamp(16px,2.4vw,22px);text-align:center}
.wmark{width:clamp(88px,11vw,132px);height:auto;border-radius:16px;box-shadow:0 18px 36px -16px var(--f-shadow)}
.wmark.on-dark{display:none}
:root[data-theme="dark"] .wmark.on-light{display:none}
:root[data-theme="dark"] .wmark.on-dark{display:block}
h1{font-family:var(--f-display);font-weight:500;color:var(--f-ink);font-size:clamp(12px,1.5vw,16px);line-height:1.4;letter-spacing:.32em;text-transform:uppercase;text-wrap:balance;padding-left:.32em}

/* ARCA: el artefacto presentado como una pieza que se puede abrir */
.arca{display:block;width:100%;text-decoration:none;color:inherit;border-radius:14px;overflow:hidden;border:1px solid var(--f-line);background:var(--f-card-bg);box-shadow:0 30px 60px -30px var(--f-shadow);transition:transform .25s, box-shadow .25s}
.arca:hover{transform:translateY(-4px)}
.arca:focus-visible{outline:2px solid var(--f-ink);outline-offset:4px}
.arca img{display:block;width:100%;height:auto;aspect-ratio:1200/630}
.arca .meta{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;background:var(--f-surface);border-top:1px solid var(--f-line);flex-wrap:wrap}
.arca .meta p{font-size:16px;line-height:1.45;color:var(--f-muted);max-width:28em;flex:1 1 260px}
.arca .meta p b{display:block;font-family:var(--f-display);font-weight:500;font-size:17px;color:var(--f-ink);margin-bottom:2px}
.arca .meta small{display:block;margin-top:6px;font-size:13px;letter-spacing:.04em}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:16px 26px;border-radius:var(--f-radius);border:1px solid var(--f-ink);background:var(--f-ink);color:var(--f-bg);font-family:var(--f-display);font-size:15px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.arca:hover .cta{background:transparent;color:var(--f-ink)}
@media (max-width:520px){
  .arca .meta{padding:18px}
  .cta{width:100%}
}

footer{padding-block:24px calc(24px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;justify-content:center}
footer .made{font-family:var(--f-display);font-size:15px;font-weight:500;color:var(--f-muted);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;justify-content:center}
footer a{display:inline-flex;align-items:center;gap:10px;color:var(--f-ink);text-decoration:none;border-bottom:1px solid var(--f-ink);padding-bottom:4px}
footer a:hover{color:var(--f-muted);border-color:var(--f-muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar gutter">
  <div class="wrap">
    <div class="seg" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" aria-pressed="true" lang="es">ES</button>
      <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
    </div>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Cambiar a modo oscuro">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="gutter">
  <div class="wrap">
    <div class="title">
      <img class="wmark on-light" src="/assets/logo/futurable-work-w-dark.svg" alt="futurable.work" width="132" height="132">
      <img class="wmark on-dark" src="/assets/logo/futurable-work-w-light.svg" alt="futurable.work" width="132" height="132">
      <h1 data-i18n="tagline">El futuro del trabajo</h1>
    </div>
    <a class="arca" href="/arca/" data-i18n-aria="cardAria" aria-label="Abrir ARCA, la entrevista de embarque">
      <img src="/arca/og.png" data-i18n-alt="cardAlt" alt="ARCA, Agencia de Reubicación de Capacidades Humanas. Antes del diluvio, aborda.">
      <div class="meta">
        <p><b data-i18n="cardTitle">ARCA · Entrevista de embarque</b><span data-i18n="cardText">18 preguntas, 5 minutos. Descubre qué tan preparado estás para el gran salto.</span><small data-i18n="cardNote" hidden></small></p>
        <span class="cta"><span data-i18n="cta">Abordar</span> <span aria-hidden="true">→</span></span>
      </div>
    </a>
  </div>
</main>

<footer class="gutter">
  <div class="wrap"><p class="made">Made by <a href="https://futurable.now">Futurable <span aria-hidden="true">↗</span></a></p></div>
</footer>

<script>
(function(){
  var T={
    es:{title:'Futurable · El futuro del trabajo',tagline:'El futuro del trabajo',cardTitle:'ARCA · Entrevista de embarque',
        cardText:'18 preguntas, 5 minutos. Descubre qué tan preparado estás para el gran salto.',cardNote:'',cta:'Abordar',
        cardAria:'Abrir ARCA, la entrevista de embarque',cardAlt:'ARCA, Agencia de Reubicación de Capacidades Humanas. Antes del diluvio, aborda.',
        toDark:'Cambiar a modo oscuro',toLight:'Cambiar a modo claro'},
    en:{title:'Futurable · The future of work',tagline:'The future of work',cardTitle:'ARCA · Boarding interview',
        cardText:'18 questions, 5 minutes. Find out how ready you are for the great leap.',cardNote:'Experience available in Spanish.',cta:'Board',
        cardAria:'Open ARCA, the boarding interview',cardAlt:'ARCA, Agency for the Relocation of Human Capabilities. Before the flood, come aboard.',
        toDark:'Switch to dark mode',toLight:'Switch to light mode'}
  };
  var d=document.documentElement, themeBtn=document.getElementById('themeBtn'), meta=document.getElementById('themeColor');
  function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function lang(){return d.lang==='en'?'en':'es'}
  function paintTheme(){
    var dark=d.getAttribute('data-theme')==='dark', t=T[lang()];
    themeBtn.setAttribute('aria-label',dark?t.toLight:t.toDark);
    meta.setAttribute('content',dark?'#0E0E0E':'#FFFFFF');
  }
  function paintLang(){
    var l=lang(), t=T[l];
    document.title=t.title;
    document.querySelectorAll('[data-i18n]').forEach(function(el){var v=t[el.dataset.i18n];el.textContent=v;if(el.tagName==='SMALL')el.hidden=!v;});
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){el.setAttribute('aria-label',t[el.dataset.i18nAria])});
    document.querySelectorAll('[data-i18n-alt]').forEach(function(el){el.alt=t[el.dataset.i18nAlt]});
    document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===l))});
    paintTheme();
  }
  document.querySelectorAll('[data-lang]').forEach(function(b){
    b.addEventListener('click',function(){d.lang=b.dataset.lang;save('fw-lang',d.lang);paintLang();});
  });
  themeBtn.addEventListener('click',function(){
    var next=d.getAttribute('data-theme')==='dark'?'light':'dark';
    d.setAttribute('data-theme',next);save('fw-theme',next);paintTheme();
  });
  paintLang();
})();
</script>
</body>
</html>
