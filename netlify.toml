[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------- arca.futurable.work: el artefacto ARCA con su propio subdominio ----------
# Los formularios de Netlify viven en la raíz del sitio.
[[redirects]]
  from = "https://arca.futurable.work/__forms.html"
  to = "/__forms.html"
  status = 200
  force = true

[[redirects]]
  from = "https://arca.futurable.work/*"
  to = "/arca/:splat"
  status = 200
  force = true

# ---------- futurable.work ----------
[[redirects]]
  from = "/arca"
  to = "/arca/"
  status = 301

[[redirects]]
  from = "/techweek"
  to = "/techweek/"
  status = 301

[[headers]]
  for = "/arca/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/techweek/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
