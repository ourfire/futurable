<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El futuro del valor humano · Futurable en Tech Week Yucatán</title>
<meta name="description" content="La charla de Futurable en Tech Week Yucatán 2026: cuatro transiciones que convergen, dos retos humanos y el gran salto. Por Alejandro Vélez.">
<meta property="og:title" content="El futuro del valor humano · Futurable">
<meta property="og:description" content="La charla de Futurable en Tech Week Yucatán, 19 de octubre de 2026.">
<meta name="theme-color" content="{{chrome_bg}}">
<link rel="icon" href="/assets/futurable-mark-dark.svg" type="image/svg+xml">
{{fonts_css}}
<style>
:root{--bg:{{bg}};--ink:{{ink}};--muted:{{muted}};--accent:{{accent}};--chrome:{{chrome_bg}};--chrome-ink:{{chrome_ink}}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--chrome);color:var(--chrome-ink);font-family:{{font_body}};overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:calc(56px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(64px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.frame{position:relative;width:1920px;height:1080px;transform-origin:center center;flex:none;box-shadow:0 30px 80px rgba(0,0,0,.35);border-radius:6px;overflow:hidden;background:var(--bg)}
.frame>section{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;color:var(--ink);visibility:hidden;opacity:0;transition:opacity .35s ease}
.frame>section.on{visibility:visible;opacity:1}
.frame section *{margin:0}
.frame section ul,.frame section ol{padding-left:1.15em;display:flex;flex-direction:column;gap:.35em}
.frame section li::marker{color:var(--accent)}
.frame section table{border-collapse:collapse;width:100%}
.frame section th{text-align:left;font-weight:700;padding:14px 18px;border-bottom:3px solid var(--accent)}
.frame section td{padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.12);vertical-align:top}
.frame section img{display:block;max-width:none}
.frame section a{text-decoration-thickness:2px;text-underline-offset:6px}
.top,.bottom{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.top{top:0;height:calc(56px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.bottom{bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:600;letter-spacing:.06em;font-size:14px;text-transform:uppercase}
.brand img{width:22px;height:22px}
.logo{font-family:{{font_display}};font-size:18px;font-weight:400;letter-spacing:-.01em;text-transform:none}
.logo img{width:26px;height:26px}
.logo b{font-weight:700}
.meta{font-family:{{font_label}};font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls{display:flex;gap:8px;align-items:center}
.btn{min-width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:inherit;font:inherit;font-size:18px;cursor:pointer;display:grid;place-items:center;padding:0 14px}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-family:{{font_label}};font-size:13px;letter-spacing:.08em;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.progress{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));height:3px;background:rgba(255,255,255,.08);z-index:5}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}
.hint{font-family:{{font_label}};font-size:12px;opacity:.55}
@media (max-width:640px){.hint,.meta{display:none}}
@media (prefers-reduced-motion:reduce){.frame>section,.progress i{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand logo" href="/" aria-label="Futurable"><img src="/assets/futurable-mark-light.svg" alt=""><span><b>Futur</b>able.</span></a>
  <span class="meta">Tech Week Yucatán · 19 oct 2026 · Alejandro Vélez</span>
  <div class="ctrls"><button class="btn" id="fs" aria-label="Pantalla completa" title="Pantalla completa (F)">⤢</button></div>
</header>

<main class="stage" id="stage" aria-roledescription="presentación" aria-label="El futuro del valor humano">
  <div class="frame" id="frame">
{{slides}}
  </div>
</main>

<div class="progress" aria-hidden="true"><i id="bar"></i></div>
<footer class="bottom">
  <span class="hint">← → para avanzar · F pantalla completa</span>
  <div class="ctrls">
    <button class="btn" id="prev" aria-label="Diapositiva anterior">←</button>
    <span class="count" id="count" aria-live="polite">1 / {{count}}</span>
    <button class="btn" id="next" aria-label="Diapositiva siguiente">→</button>
  </div>
  <a class="brand" href="https://arca.futurable.work" style="font-size:12px">Haz el diagnóstico ARCA →</a>
</footer>

<script>
(function(){
  var frame=document.getElementById('frame'), stage=document.getElementById('stage');
  var slides=[].slice.call(frame.children), n=slides.length, i=0;
  function fit(){
    var cs=getComputedStyle(stage);
    var w=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    var h=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    var s=Math.min(w/1920,h/1080);
    frame.style.transform='scale('+s+')';
    frame.style.margin=((1080*s-1080)/2)+'px '+((1920*s-1920)/2)+'px';
  }
  function go(k,push){
    i=Math.max(0,Math.min(n-1,k));
    slides.forEach(function(s,j){s.classList.toggle('on',j===i); s.setAttribute('aria-hidden',j===i?'false':'true');});
    document.getElementById('count').textContent=(i+1)+' / '+n;
    document.getElementById('bar').style.width=((i+1)/n*100)+'%';
    if(push!==false) try{history.replaceState(null,'','#'+(i+1));}catch(e){}
    // precarga la siguiente
    var nx=slides[i+1]; if(nx) nx.querySelectorAll('img[loading=lazy]').forEach(function(im){im.loading='eager';});
  }
  document.getElementById('next').onclick=function(){go(i+1)};
  document.getElementById('prev').onclick=function(){go(i-1)};
  document.addEventListener('keydown',function(e){
    if(['ArrowRight','PageDown',' ','Enter'].indexOf(e.key)>-1){e.preventDefault();go(i+1)}
    else if(['ArrowLeft','PageUp','Backspace'].indexOf(e.key)>-1){e.preventDefault();go(i-1)}
    else if(e.key==='Home'){go(0)} else if(e.key==='End'){go(n-1)}
    else if(e.key==='f'||e.key==='F'){toggleFs()}
  });
  frame.addEventListener('click',function(e){ if(e.target.closest('a')) return; var r=frame.getBoundingClientRect(); go(e.clientX>r.left+r.width/3?i+1:i-1); });
  var x0=null; stage.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  stage.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) go(dx<0?i+1:i-1); x0=null; },{passive:true});
  function toggleFs(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){}); else document.exitFullscreen(); }catch(e){} }
  document.getElementById('fs').onclick=toggleFs;
  window.addEventListener('resize',fit); fit();
  function fromHash(){ var h=parseInt((location.hash||'').slice(1),10); go(isNaN(h)?0:h-1,false); }
  window.addEventListener('hashchange',fromHash); fromHash();
})();
</script>
</body>
</html>
